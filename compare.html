<!doctype html>
<!-- BOoDe -->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="author" content="BOoDe" />
    <title>Compare Emails — Phishing Email Analyzer</title>
    <link rel="icon" href="favicon-32.png" sizes="32x32" type="image/png" />
    <link rel="icon" href="favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="apple-touch-icon.png" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src *; frame-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'"
    />
    <link rel="stylesheet" href="styles/fonts.css" />
    <link rel="stylesheet" href="styles/main.css" />
    <link rel="stylesheet" href="styles/compare.css" />
  </head>
  <body>
    <div class="app-container">
      <div class="trust-banner">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z" />
        </svg>
        <span>Every message is parsed in this browser. Nothing is uploaded.</span>
      </div>

      <header class="app-header">
        <h1>
          <svg class="app-logo" viewBox="-5 -5 110 110" width="30" height="30" aria-hidden="true">
            <defs>
              <g id="logo-eye">
                <circle cx="50" cy="50" r="48" fill="#000" />
                <circle cx="50" cy="50" r="46.5" fill="none" stroke="currentColor" stroke-width="2.5" />
                <g id="logo-t" fill="currentColor">
                  <path d="M50 12A38 38 0 0 1 81 28Q69 22 50 26Z" />
                  <circle cx="50" cy="19" r="7" />
                </g>
                <use href="#logo-t" transform="rotate(120 50 50)" />
                <use href="#logo-t" transform="rotate(240 50 50)" />
                <circle cx="50" cy="50" r="8" fill="currentColor" />
              </g>
              <clipPath id="logo-s1"><rect x="-10" y="22" width="120" height="7" /></clipPath>
              <clipPath id="logo-s2"><rect x="-10" y="47" width="120" height="5" /></clipPath>
              <clipPath id="logo-s3"><rect x="-10" y="70" width="120" height="6" /></clipPath>
            </defs>
            <use href="#logo-eye" />
            <g clip-path="url(#logo-s1)"><use href="#logo-eye" x="7" /></g>
            <g clip-path="url(#logo-s2)"><use href="#logo-eye" x="-6" /></g>
            <g clip-path="url(#logo-s3)"><use href="#logo-eye" x="5" /></g>
          </svg>
          Compare Emails
        </h1>
        <a class="btn btn-secondary" href="index.html">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <line x1="19" y1="12" x2="5" y2="12" /><polyline points="12 19 5 12 12 5" />
          </svg>
          <span class="btn-label">Back to analyzer</span>
        </a>
      </header>

      <section class="panel" id="drop-panel">
        <h2>Drop the messages here</h2>
        <div id="dropzone" class="dropzone" tabindex="0" role="button" aria-label="Drop email files here or click to choose">
          <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true">
            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4" /><polyline points="7 10 12 5 17 10" /><line x1="12" y1="5" x2="12" y2="16" />
          </svg>
          <p class="dropzone-title">Drag and drop as many <code>.eml</code> files as you like</p>
          <p class="dropzone-sub">or click to choose them — every message is parsed here, in this browser</p>
          <input type="file" id="compare-files" accept=".eml,.txt,.msg" multiple hidden />
        </div>
        <div class="compare-toolbar">
          <button class="btn btn-secondary" type="button" data-act="add-sample">Load the sample messages</button>
          <button class="btn btn-secondary" type="button" data-act="clear-all">Clear all</button>
          <span class="compare-count" id="compare-count"></span>
        </div>
        <div id="compare-status" class="status-message" role="status" aria-live="polite"></div>
      </section>

      <section class="panel hidden" id="shared-panel">
        <h2>What these messages share</h2>
        <div id="shared-content"></div>
      </section>

      <section class="panel hidden" id="table-panel">
        <div class="compare-head">
          <h2>Side by side</h2>
          <div class="compare-actions">
            <label class="compare-toggle"><input type="checkbox" id="hide-identical" /> Only show differences</label>
            <button class="btn btn-secondary btn-sm" type="button" data-act="export-csv">CSV</button>
            <button class="btn btn-secondary btn-sm" type="button" data-act="export-json">JSON</button>
          </div>
        </div>
        <div id="table-content"></div>
      </section>
    </div>

    <script type="module" src="scripts/compare.js"></script>
  </body>
</html>
